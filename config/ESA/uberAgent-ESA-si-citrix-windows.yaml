config-version: 9.0
timers:
  - name: "Security & Compliance Inventory timer"
    interval: 24h
    start-delay: 10m
    persist-interval: true
    ua-metrics:
      - SecurityInventory.Antivirus
      - SecurityInventory.Firewall
      - SecurityInventory.LocalUsersAndGroups
      - SecurityInventory.Network
      - SecurityInventory.PowerShell
      - SecurityInventory.Service
      - SecurityInventory.WindowsConfiguration
  - name: "Security & Compliance Inventory timer for Certificate"
    interval: 24h
    start-delay: 10m
    persist-interval: true
    ua-metrics:
      - SecurityInventory.Certificate
script-interpreters:
  - name: PowerShell
    executable: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    args-template: "-ExecutionPolicy Bypass -file ###UA_SCRIPT###"
security-inventory-tests:
  - platform: windows
    name: Antivirus
    script-id: 01270F6B-7160-4629-90C4-F36E621D43E1
    category: Antivirus
    script-timeout: 10m
    script-commandline: "\"###UA_SI_LOCALPATH###\\Antivirus\\Antivirus.ps1\""
    interpreter: PowerShell
    script-context: session-0-as-system
    integrity-level: Medium + AllowChildProcesses=2
  - platform: windows
    name: Certificate-Machine
    script-id: 02270F6B-7160-4629-90C4-F36E621D43E2
    category: Certificate
    script-timeout: 10m
    script-commandline: "\"###UA_SI_LOCALPATH###\\Certificate\\Certificate-Machine.ps1\""
    interpreter: PowerShell
    script-context: session-0-as-system
    integrity-level: High
  - platform: windows
    name: Certificate-User
    script-id: 03270F6B-7160-4629-90C4-F36E621D43C2
    category: Certificate
    script-timeout: 10m
    script-commandline: "\"###UA_SI_LOCALPATH###\\Certificate\\Certificate-User.ps1\""
    interpreter: PowerShell
    script-context: user-session-as-user
    integrity-level: Medium + AllowChildProcesses=3
  - platform: windows
    name: Firewall
    script-id: 04270F6B-7160-4629-90C4-F36E621D43E3
    category: Firewall
    script-timeout: 10m
    script-commandline: "\"###UA_SI_LOCALPATH###\\Firewall\\Firewall.ps1\""
    interpreter: PowerShell
