    script-context: session-0-as-system
    integrity-level: Medium + AllowChildProcesses=2
  - platform: windows
    name: LocalUsersAndGroups-User
    script-id: 06270F6B-7160-4629-90C4-F36E621D43E5
    category: LocalUsersAndGroups
    script-timeout: 10m
