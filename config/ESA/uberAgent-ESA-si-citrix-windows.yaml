    integrity-level: Medium + AllowChildProcesses=2
  - platform: windows
    name: LocalUsersAndGroups-Machine
    script-id: 05270F6B-7160-4629-90C4-F36E621D43E4
    category: LocalUsersAndGroups
    script-timeout: 10m
    script-commandline: "\"###UA_SI_LOCALPATH###\\LocalUserAndGroups\\LocalUsersAndGroups-Machine.ps1\""
