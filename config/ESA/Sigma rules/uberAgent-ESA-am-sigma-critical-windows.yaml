    tag: proc-start-wmi-backdoor-exchange-transport-agent
    risk-score: 100
    annotation: "{\"mitre_attack\": [\"T1546.003\"], \"author\": \"Florian Roth (Nextron Systems)\"}"
    query: iendswith(Parent.Path, "\\EdgeTransport.exe") and not (Process.Path == "C:\\Windows\\System32\\conhost.exe" or istartswith(Process.Path, "C:\\Program Files\\Microsoft\\Exchange Server\\") and iendswith(Process.Path, "\\Bin\\OleConverter.exe"))
