  - platform: windows
    rule-id: 73d70463-75c9-4258-92c6-17500fe972f2
    rule-name: Winnti Pipemon Characteristics
    tag: proc-start-winnti-pipemon-characteristics
    risk-score: 100
    annotation: "{\"mitre_attack\": [\"T1574.001\"], \"author\": \"Florian Roth (Nextron Systems), oscd.community\"}"
    query: icontains(Process.CommandLine, "setup0.exe -p") or icontains(Process.CommandLine, "setup.exe") and (iendswith(Process.CommandLine, "-x:0") or iendswith(Process.CommandLine, "-x:1") or iendswith(Process.CommandLine, "-x:2"))
    event-type: Process.Start
  - platform: windows
    rule-id: ba479447-721f-42a9-9af2-6dcd517bbdb3
    rule-name: Potential SharePoint ToolShell CVE-2025-53770 Exploitation - File Create
    tag: potential-sharepoint-toolshell-cve-2025-53770-exploitation-file-create
    risk-score: 100
    annotation: "{\"mitre_attack\": [\"T1190\"], \"author\": \"Swachchhanda Shrawan Poudel (Nextron Systems)\"}"
    query: (istartswith(File.Path, "C:\\Program Files\\Common Files\\Microsoft Shared\\Web Server Extensions\\") or istartswith(File.Path, "C:\\Program Files (x86)\\Common Files\\Microsoft Shared\\Web Server Extensions\\")) and (icontains(File.Path, "\\15\\TEMPLATE\\LAYOUTS\\") or icontains(File.Path, "\\16\\TEMPLATE\\LAYOUTS\\")) and (iendswith(File.Path, "\\spinstall.aspx") or File.Path like r"%\\spinstall_.aspx" or iendswith(File.Path, "\\debug\_dev.js"))
    event-type: File.Create
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: 3711eee4-a808-4849-8a14-faf733da3612
    rule-name: Greenbug Espionage Group Indicators
    tag: proc-start-greenbug-espionage-group-indicators
    risk-score: 100
