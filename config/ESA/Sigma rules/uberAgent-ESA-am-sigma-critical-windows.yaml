    tag: hacktool-dumpert-process-dumper-default-file
    risk-score: 100
    annotation: "{\"mitre_attack\": [\"T1003.001\"], \"author\": \"Florian Roth (Nextron Systems)\"}"
    query: iendswith(File.Path, "dumpert.dmp")
    event-type: File.Create
    generic-properties:
