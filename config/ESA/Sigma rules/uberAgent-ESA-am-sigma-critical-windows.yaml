  - platform: windows
    rule-id: d465d1d8-27a2-4cca-9621-a800f37cf72e
    rule-name: Equation Group DLL_U Export Function Load
    tag: proc-start-equation-group-dll_u-export-function-load
    risk-score: 100
    annotation: "{\"mitre_attack\": [\"T1218.011\"], \"author\": \"Florian Roth (Nextron Systems)\"}"
    query: icontains(Process.CommandLine, "-export dll\_u") or iendswith(Process.CommandLine, ",dll\_u") or iendswith(Process.CommandLine, " dll\_u")
    event-type: Process.Start
  - platform: windows
    rule-id: 1070db9a-3e5d-412e-8e7b-7183b616e1b3
    rule-name: Persistence Via Sticky Key Backdoor
    tag: proc-start-persistence-via-sticky-key-backdoor
    risk-score: 100
    annotation: "{\"mitre_attack\": [\"T1546.008\"], \"author\": \"Sreeman\"}"
    query: icontains(Process.CommandLine, "copy ") and icontains(Process.CommandLine, "/y ") and icontains(Process.CommandLine, "C:\\windows\\system32\\cmd.exe C:\\windows\\system32\\sethc.exe")
    event-type: Process.Start
  - platform: windows
    rule-id: 889719ef-dd62-43df-86c3-768fb08dc7c0
    rule-name: Suspicious PowerShell Mailbox Export to Share
    tag: proc-start-suspicious-powershell-mailbox-export-to-share
    risk-score: 100
    annotation: "{\"author\": \"Florian Roth (Nextron Systems)\"}"
    query: icontains(Process.CommandLine, "New-MailboxExportRequest") and icontains(Process.CommandLine, " -Mailbox ") and icontains(Process.CommandLine, " -FilePath \\\\")
    event-type: Process.Start
  - platform: windows
    rule-id: 58d8341a-5849-44cd-8ac8-8b020413a31b
    rule-name: Mint Sandstorm - ManageEngine Suspicious Process Execution
    tag: proc-start-mint-sandstorm-manageengine-suspicious-process-execution
    risk-score: 100
    annotation: "{\"author\": \"Nasreddine Bencherchali (Nextron Systems), MSTIC (idea)\"}"
    query: (icontains(Parent.Path, "manageengine") or icontains(Parent.Path, "ServiceDesk")) and icontains(Parent.Path, "\\java") and ((iendswith(Process.Path, "\\powershell.exe") or iendswith(Process.Path, "\\powershell\_ise.exe")) and (icontains(Process.CommandLine, " echo ") or icontains(Process.CommandLine, "-dumpmode") or icontains(Process.CommandLine, "-ssh") or icontains(Process.CommandLine, ".dmp") or icontains(Process.CommandLine, "add-MpPreference") or icontains(Process.CommandLine, "adscredentials") or icontains(Process.CommandLine, "bitsadmin") or icontains(Process.CommandLine, "certutil") or icontains(Process.CommandLine, "csvhost.exe") or icontains(Process.CommandLine, "DownloadFile") or icontains(Process.CommandLine, "DownloadString") or icontains(Process.CommandLine, "dsquery") or icontains(Process.CommandLine, "ekern.exe") or icontains(Process.CommandLine, "FromBase64String") or icontains(Process.CommandLine, "iex ") or icontains(Process.CommandLine, "iex(") or icontains(Process.CommandLine, "Invoke-Expression") or icontains(Process.CommandLine, "Invoke-WebRequest") or icontains(Process.CommandLine, "localgroup administrators") or icontains(Process.CommandLine, "o365accountconfiguration") or icontains(Process.CommandLine, "samaccountname=") or icontains(Process.CommandLine, "set-MpPreference") or icontains(Process.CommandLine, "svhost.exe") or icontains(Process.CommandLine, "System.IO.Compression") or icontains(Process.CommandLine, "System.IO.MemoryStream") or icontains(Process.CommandLine, "usoprivate") or icontains(Process.CommandLine, "usoshared") or icontains(Process.CommandLine, "whoami") or Process.CommandLine regex "[-/–][Ee^]{1,2}[ncodema^]*\\s[A-Za-z0-9+/=]{15,}" or Process.CommandLine regex "net\\s+user" or Process.CommandLine regex "net\\s+group" or Process.CommandLine regex "query\\ssession") or icontains(Process.CommandLine, "lsass") and (icontains(Process.CommandLine, "procdump") or icontains(Process.CommandLine, "tasklist") or icontains(Process.CommandLine, "findstr")) or iendswith(Process.Path, "\\wget.exe") and icontains(Process.CommandLine, "http") or iendswith(Process.Path, "\\curl.exe") and icontains(Process.CommandLine, "http") or icontains(Process.CommandLine, "E:jscript") or icontains(Process.CommandLine, "e:vbscript") or icontains(Process.CommandLine, "localgroup Administrators") and icontains(Process.CommandLine, "/add") or icontains(Process.CommandLine, "net") and icontains(Process.CommandLine, "user") and icontains(Process.CommandLine, "/add") or icontains(Process.CommandLine, "reg add") and icontains(Process.CommandLine, "DisableAntiSpyware") and icontains(Process.CommandLine, "\\Microsoft\\Windows Defender") or icontains(Process.CommandLine, "reg add") and icontains(Process.CommandLine, "DisableRestrictedAdmin") and icontains(Process.CommandLine, "CurrentControlSet\\Control\\Lsa") or icontains(Process.CommandLine, "wmic") and icontains(Process.CommandLine, "process call create") or icontains(Process.CommandLine, "wmic") and icontains(Process.CommandLine, "delete") and icontains(Process.CommandLine, "shadowcopy") or icontains(Process.CommandLine, "vssadmin") and icontains(Process.CommandLine, "delete") and icontains(Process.CommandLine, "shadows") or icontains(Process.CommandLine, "wbadmin") and icontains(Process.CommandLine, "delete") and icontains(Process.CommandLine, "catalog")) and not (icontains(Process.CommandLine, "download.microsoft.com") and icontains(Process.CommandLine, "manageengine.com") and icontains(Process.CommandLine, "msiexec"))
    event-type: Process.Start
    generic-properties:
      - Parent.Path
  - platform: windows
    rule-id: 24c4d154-05a4-4b99-b57d-9b977472443a
    rule-name: Lazarus Group Activity
    tag: proc-start-lazarus-group-activity
    risk-score: 100
    annotation: "{\"mitre_attack\": [\"T1059\"], \"author\": \"Florian Roth (Nextron Systems), wagga\"}"
    query: icontains(Process.CommandLine, "reg.exe save hklm\\sam \%temp\%\\~reg\_sam.save") or icontains(Process.CommandLine, "1q2w3e4r@#$@#$@#$") or icontains(Process.CommandLine, " -hp1q2w3e4 ") or icontains(Process.CommandLine, ".dat data03 10000 -p ") or icontains(Process.CommandLine, "netstat -aon | find ") and icontains(Process.CommandLine, "ESTA") and icontains(Process.CommandLine, " > \%temp\%\\~") or icontains(Process.CommandLine, ".255 10 C:\\ProgramData\\IBM\\") and icontains(Process.CommandLine, ".DAT") or icontains(Process.CommandLine, " /c ") and icontains(Process.CommandLine, " -p 0x") and (icontains(Process.CommandLine, "C:\\ProgramData\\") or icontains(Process.CommandLine, "C:\\RECYCLER\\")) or icontains(Process.CommandLine, "rundll32 ") and icontains(Process.CommandLine, "C:\\ProgramData\\") and (icontains(Process.CommandLine, ".bin,") or icontains(Process.CommandLine, ".tmp,") or icontains(Process.CommandLine, ".dat,") or icontains(Process.CommandLine, ".io,") or icontains(Process.CommandLine, ".ini,") or icontains(Process.CommandLine, ".db,"))
    event-type: Process.Start
  - platform: windows
    rule-id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
    rule-name: Wmiexec Default Output File
    tag: wmiexec-default-output-file
    risk-score: 100
    annotation: "{\"mitre_attack\": [\"T1047\"], \"author\": \"Nasreddine Bencherchali (Nextron Systems)\"}"
    query: File.Path regex "\\\\Windows\\\\__1\\d{9}\\.\\d{1,7}$" or File.Path regex "C:\\\\__1\\d{9}\\.\\d{1,7}$" or File.Path regex "D:\\\\__1\\d{9}\\.\\d{1,7}$"
    event-type: File.Create
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: 2f7979ae-f82b-45af-ac1d-2b10e93b0baa
    rule-name: Potential DCOM InternetExplorer.Application DLL Hijack
    tag: potential-dcom-internetexplorer.application-dll-hijack
    risk-score: 100
    annotation: "{\"mitre_attack\": [\"T1021.002\", \"T1021.003\"], \"author\": \"Roberto Rodriguez @Cyb3rWard0g, Open Threat Research (OTR), wagga\"}"
    query: Process.Path == "System" and iendswith(File.Path, "\\Internet Explorer\\iertutil.dll")
    event-type: File.Create
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: 3be82d5d-09fe-4d6a-a275-0d40d234d324
    rule-name: InstallerFileTakeOver LPE CVE-2021-41379 File Create Event
