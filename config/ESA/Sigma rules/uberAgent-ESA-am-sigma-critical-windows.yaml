    risk-score: 100
    annotation: "{\"mitre_attack\": [\"T1068\"], \"author\": \"Florian Roth (Nextron Systems)\"}"
    query: iendswith(Process.Path, "\\msiexec.exe") and istartswith(File.Path, "C:\\Program Files (x86)\\Microsoft\\Edge\\Application") and iendswith(File.Path, "\\elevation\_service.exe")
    event-type: File.Create
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: 93d94efc-d7ad-4161-ad7d-1638c4f908d8
