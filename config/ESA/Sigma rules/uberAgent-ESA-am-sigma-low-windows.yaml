threat-detection-rules:
  - platform: windows
    rule-id: b1decb61-ed83-4339-8e95-53ea51901720
    rule-name: TeamViewer Log File Deleted
    tag: teamviewer-log-file-deleted
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1070.004\"], \"author\": \"frack113\"}"
    query: icontains(File.Path, "\\TeamViewer\_") and iendswith(File.Path, ".log") and not Process.Path == "C:\\Windows\\system32\\svchost.exe"
    event-type: File.Delete
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: f8de9dd5-7a63-4cfd-9d0c-ae124878b5a9
    rule-name: Process Execution From WebDAV Share
    tag: proc-start-process-execution-from-webdav-share
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1105\"], \"author\": \"Swachchhanda Shrawan Poudel (Nextron Systems)\"}"
    query: istartswith(Process.Path, "\\\\") and icontains(Process.Path, "\\DavWWWRoot\\")
    event-type: Process.Start
  - platform: windows
    rule-id: 0afecb6e-6223-4a82-99fb-bf5b981e92a5
    rule-name: Remote Access Tool - ScreenConnect Temporary File
    tag: remote-access-tool-screenconnect-temporary-file
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1059.003\"], \"author\": \"Ali Alwashali\"}"
    query: iendswith(Process.Path, "\\ScreenConnect.WindowsClient.exe") and icontains(File.Path, "\\Documents\\ConnectWiseControl\\Temp\\")
    event-type: File.Create
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: 91174a41-dc8f-401b-be89-7bfc140612a0
    rule-name: Office Macro File Creation
    tag: office-macro-file-creation
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1566.001\"], \"author\": \"Nasreddine Bencherchali (Nextron Systems)\"}"
    query: (iendswith(File.Path, ".docm") or iendswith(File.Path, ".dotm") or iendswith(File.Path, ".xlsm") or iendswith(File.Path, ".xltm") or iendswith(File.Path, ".potm") or iendswith(File.Path, ".pptm")) and not ((istartswith(Process.Path, "C:\\Program Files\\Microsoft Office\\") or istartswith(Process.Path, "C:\\Program Files (x86)\\Microsoft Office\\")) and (iendswith(Process.Path, "\\WINWORD.EXE") or iendswith(Process.Path, "\\EXCEL.EXE") or iendswith(Process.Path, "\\POWERPNT.EXE")) and icontains(File.Path, "\\~$"))
    event-type: File.Create
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: c5f37810-a85f-4186-81e9-33f23abb4141
    rule-name: Access To Chromium Browsers Sensitive Files By Uncommon Applications
    tag: access-to-chromium-browsers-sensitive-files-by-uncommon-applications
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1003\"], \"author\": \"X__Junior (Nextron Systems)\"}"
    query: (icontains(File.Path, "\\User Data\\Default\\Cookies") or icontains(File.Path, "\\User Data\\Default\\History") or icontains(File.Path, "\\User Data\\Default\\Network\\Cookies") or icontains(File.Path, "\\User Data\\Default\\Web Data")) and not (Process.Path == "System" or istartswith(Process.Path, "C:\\Program Files (x86)\\") or istartswith(Process.Path, "C:\\Program Files\\") or istartswith(Process.Path, "C:\\Windows\\system32\\") or istartswith(Process.Path, "C:\\Windows\\SysWOW64\\")) and not (istartswith(Process.Path, "C:\\ProgramData\\Microsoft\\Windows Defender\\") and (iendswith(Process.Path, "\\MpCopyAccelerator.exe") or iendswith(Process.Path, "\\MsMpEng.exe")))
    event-type: File.Read
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: 3b92a1d0-8d4b-4d28-a1b4-1e29d49a6a3e
    rule-name: Task Scheduler DLL Loaded By Application Located In Potentially Suspicious Location
    tag: task-scheduler-dll-loaded-by-application-located-in-potentially-suspicious-location
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1053.005\"], \"author\": \"Swachchhanda Shrawan Poudel\"}"
    query: (iendswith(Image.Path, "\\taskschd.dll") or Process.Name == "taskschd.dll") and (icontains(Process.Path, ":\\Temp\\") or icontains(Process.Path, ":\\Users\\Public\\") or icontains(Process.Path, ":\\Windows\\Temp\\") or icontains(Process.Path, "\\AppData\\Local\\Temp\\") or icontains(Process.Path, "\\Desktop\\") or icontains(Process.Path, "\\Downloads\\"))
    event-type: Image.Load
    generic-properties:
      - Image.Path
  - platform: windows
    rule-id: 903076ff-f442-475a-b667-4f246bcc203b
    rule-name: Nltest.EXE Execution
    tag: proc-start-nltest.exe-execution
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1016\", \"T1018\", \"T1482\"], \"author\": \"Arun Chauhan\"}"
    query: iendswith(Process.Path, "\\nltest.exe") or Process.Name == "nltestrk.exe"
    event-type: Process.Start
  - platform: windows
    rule-id: 7eac0a16-5832-4e81-865f-0268a6d19e4b
    rule-name: ADS Zone.Identifier Deleted
    tag: ads-zone.identifier-deleted
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1070.004\"], \"author\": \"frack113\"}"
    query: iendswith(File.Path, ":Zone.Identifier")
    event-type: File.Delete
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: 0b8baa3f-575c-46ee-8715-d6f28cc7d33c
    rule-name: NTDS.DIT Created
    tag: ntds.dit-created
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1003.003\"], \"author\": \"Nasreddine Bencherchali (Nextron Systems)\"}"
    query: iendswith(File.Path, "ntds.dit")
    event-type: File.Create
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: bf361876-6620-407a-812f-bfe11e51e924
    rule-name: Compressed File Extraction Via Tar.EXE
    tag: proc-start-compressed-file-extraction-via-tar.exe
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1560\", \"T1560.001\"], \"author\": \"AdmU3\"}"
    query: (iendswith(Process.Path, "\\tar.exe") or Process.Name == "bsdtar") and icontains(Process.CommandLine, "-x")
    event-type: Process.Start
  - platform: windows
    rule-id: 576426ad-0131-4001-ae01-be175da0c108
    rule-name: PowerShell Script Dropped Via PowerShell.EXE
    tag: powershell-script-dropped-via-powershell.exe
    risk-score: 25
    annotation: "{\"author\": \"frack113\"}"
    query: (iendswith(Process.Path, "\\powershell.exe") or iendswith(Process.Path, "\\pwsh.exe")) and iendswith(File.Path, ".ps1") and not (icontains(File.Path, "\_\_PSScriptPolicyTest\_") or istartswith(File.Path, "C:\\Users\\") and icontains(File.Path, "\\AppData\\Local\\Temp\\") or istartswith(File.Path, "C:\\Windows\\Temp\\"))
    event-type: File.Create
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: 4f281b83-0200-4b34-bf35-d24687ea57c2
    rule-name: ETW Logging Disabled For SCM
    tag: etw-logging-disabled-for-scm
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1112\", \"T1685\"], \"author\": \"Nasreddine Bencherchali (Nextron Systems)\"}"
    query: iendswith(Reg.TargetObject, "Software\\Microsoft\\Windows NT\\CurrentVersion\\Tracing\\SCM\\Regular\\TracingDisabled") and Reg.Value.Data == "DWORD (0x00000001)"
    hive:
      - HKLM
      - HKU
    event-types:
      - Reg.Value.Write
      - Reg.Key.Rename
      - Reg.Key.Restore
      - Reg.Key.Replace
    generic-properties:
      - Reg.TargetObject
      - Reg.Value.Data
  - platform: windows
    rule-id: 68c8acb4-1b60-4890-8e82-3ddf7a6dba84
    rule-name: HH.EXE Execution
    tag: proc-start-hh.exe-execution
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1218.001\"], \"author\": \"E.M. Anhaus (originally from Atomic Blue Detections, Dan Beavin), oscd.community\"}"
    query: (Process.Name == "HH.exe" or iendswith(Process.Path, "\\hh.exe")) and icontains(Process.CommandLine, ".chm")
    event-type: Process.Start
  - platform: windows
    rule-id: bb19e94c-59ae-4c15-8c12-c563d23fe52b
    rule-name: Set Files as System Files Using Attrib.EXE
    tag: proc-start-set-files-as-system-files-using-attrib.exe
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1564.001\"], \"author\": \"frack113\"}"
    query: (iendswith(Process.Path, "\\attrib.exe") or Process.Name == "ATTRIB.EXE") and icontains(Process.CommandLine, " +s ")
    event-type: Process.Start
  - platform: windows
    rule-id: ab70c354-d9ac-4e11-bbb6-ec8e3b153357
    rule-name: Remote Access Tool - Team Viewer Session Started On Windows Host
    tag: proc-start-remote-access-tool-team-viewer-session-started-on-windows-host
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1133\"], \"author\": \"Josh Nickels, Qi Nan\"}"
    query: Process.Path == "TeamViewer\_Desktop.exe" and Parent.Path == "TeamViewer\_Service.exe" and iendswith(Process.CommandLine, "TeamViewer\_Desktop.exe --IPCport 5939 --Module 1")
    event-type: Process.Start
    generic-properties:
      - Parent.Path
  - platform: windows
    rule-id: e83e8899-c9b2-483b-b355-5decc942b959
    rule-name: Interesting Service Enumeration Via Sc.EXE
    tag: proc-start-interesting-service-enumeration-via-sc.exe
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1003\"], \"author\": \"Swachchhanda Shrawan Poudel\"}"
    query: (iendswith(Process.Path, "\\sc.exe") or Process.Name == "sc.exe") and icontains(Process.CommandLine, "query") and icontains(Process.CommandLine, "termservice")
    event-type: Process.Start
  - platform: windows
    rule-id: 0e6a9e62-627e-496c-aef5-bfa39da29b5e
    rule-name: MaxMpxCt Registry Value Changed
    tag: maxmpxct-registry-value-changed
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1070.005\"], \"author\": \"Nasreddine Bencherchali (Nextron Systems)\"}"
    query: iendswith(Reg.TargetObject, "\\Services\\LanmanServer\\Parameters\\MaxMpxCt")
    hive:
      - HKLM
      - HKU
    event-types:
      - Reg.Value.Write
      - Reg.Key.Rename
      - Reg.Key.Restore
      - Reg.Key.Replace
    generic-properties:
      - Reg.TargetObject
  - platform: windows
    rule-id: 86085955-ea48-42a2-9dd3-85d4c36b167d
    rule-name: Process Terminated Via Taskkill
    tag: proc-start-process-terminated-via-taskkill
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1489\"], \"author\": \"frack113, MalGamy (Nextron Systems), Nasreddine Bencherchali\"}"
    query: (iendswith(Process.Path, "\\taskkill.exe") or Process.Name == "taskkill.exe") and (icontains(Process.CommandLine, " -f ") or icontains(Process.CommandLine, " /f ") or icontains(Process.CommandLine, " –f ") or icontains(Process.CommandLine, " —f ") or icontains(Process.CommandLine, " ―f ") or iendswith(Process.CommandLine, " -f") or iendswith(Process.CommandLine, " /f") or iendswith(Process.CommandLine, " –f") or iendswith(Process.CommandLine, " —f") or iendswith(Process.CommandLine, " ―f")) and (icontains(Process.CommandLine, " -im ") or icontains(Process.CommandLine, " /im ") or icontains(Process.CommandLine, " –im ") or icontains(Process.CommandLine, " —im ") or icontains(Process.CommandLine, " ―im ") or icontains(Process.CommandLine, " -pid ") or icontains(Process.CommandLine, " /pid ") or icontains(Process.CommandLine, " –pid ") or icontains(Process.CommandLine, " —pid ") or icontains(Process.CommandLine, " ―pid ")) and not ((icontains(Parent.Path, "\\AppData\\Local\\Temp\\") or icontains(Parent.Path, ":\\Windows\\Temp")) and iendswith(Parent.Path, ".tmp"))
    event-type: Process.Start
    generic-properties:
      - Parent.Path
  - platform: windows
    rule-id: cb7c4a03-2871-43c0-9bbb-18bbdb079896
    rule-name: Unmount Share Via Net.EXE
    tag: proc-start-unmount-share-via-net.exe
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1070.005\"], \"author\": \"oscd.community, @redcanary, Zach Stanford @svch0st\"}"
    query: (iendswith(Process.Path, "\\net.exe") or iendswith(Process.Path, "\\net1.exe") or Process.Name in ["net.exe", "net1.exe"]) and icontains(Process.CommandLine, "share") and icontains(Process.CommandLine, "/delete")
    event-type: Process.Start
  - platform: windows
    rule-id: facd1549-e416-48e0-b8c4-41d7215eedc8
    rule-name: Amsi.DLL Load By Uncommon Process
    tag: amsi.dll-load-by-uncommon-process
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1490\"], \"author\": \"frack113\"}"
    query: iendswith(Image.Path, "\\amsi.dll") and not (iendswith(Process.Path, ":\\Windows\\explorer.exe") or iendswith(Process.Path, ":\\Windows\\Sysmon64.exe") or iendswith(Process.Path, ":\\Windows\\Sysmon64a.exe") or icontains(Process.Path, ":\\Program Files (x86)\\") or icontains(Process.Path, ":\\Program Files\\") or icontains(Process.Path, ":\\Windows\\System32\\") or icontains(Process.Path, ":\\Windows\\SysWOW64\\") or icontains(Process.Path, ":\\Windows\\WinSxS\\") or (icontains(Process.Path, ":\\Windows\\Microsoft.NET\\Framework\\") or icontains(Process.Path, ":\\Windows\\Microsoft.NET\\Framework64\\") or icontains(Process.Path, ":\\Windows\\Microsoft.NET\\FrameworkArm\\") or icontains(Process.Path, ":\\Windows\\Microsoft.NET\\FrameworkArm64\\")) and iendswith(Process.Path, "\\ngentask.exe") or isnull(Process.Path) or Process.Path == "") and not (icontains(Process.Path, ":\\ProgramData\\Microsoft\\Windows Defender\\Platform\\") and iendswith(Process.Path, "\\MsMpEng.exe"))
    event-type: Image.Load
    generic-properties:
      - Image.Path
  - platform: windows
    rule-id: 7c9340a9-e2ee-4e43-94c5-c54ebbea1006
    rule-name: File And SubFolder Enumeration Via Dir Command
    tag: proc-start-file-and-subfolder-enumeration-via-dir-command
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1217\"], \"author\": \"frack113\"}"
    query: (iendswith(Process.Path, "\\cmd.exe") or Process.Name == "Cmd.Exe") and (icontains(Process.CommandLine, "-s") or icontains(Process.CommandLine, "/s") or icontains(Process.CommandLine, "–s") or icontains(Process.CommandLine, "—s") or icontains(Process.CommandLine, "―s")) and icontains(Process.CommandLine, "dir ") and not icontains(Process.CommandLine, "rmdir")
    event-type: Process.Start
  - platform: windows
    rule-id: 1337afba-d17d-4d23-bd55-29b927603b30
    rule-name: Microsoft Word Add-In Loaded
    tag: microsoft-word-add-in-loaded
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1204.002\"], \"author\": \"Steffen Rogge (dr0pd34d)\"}"
    query: iendswith(Process.Path, "\\winword.exe") and iendswith(Image.Path, ".wll")
    event-type: Image.Load
    generic-properties:
      - Image.Path
  - platform: windows
    rule-id: 337a31c6-46c4-46be-886a-260d7aa78cac
    rule-name: Access To .Reg/.Hive Files By Uncommon Applications
    tag: access-to-.reg/.hive-files-by-uncommon-applications
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1112\"], \"author\": \"frack113\"}"
    query: (iendswith(File.Path, ".hive") or iendswith(File.Path, ".reg")) and not (istartswith(Process.Path, "C:\\Program Files (x86)\\") or istartswith(Process.Path, "C:\\Program Files\\") or istartswith(Process.Path, "C:\\Windows\\System32\\") or istartswith(Process.Path, "C:\\Windows\\SysWOW64\\"))
    event-type: File.Read
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: 93ff0ceb-e0ef-4586-8cd8-a6c277d738e3
    rule-name: Scheduled Task Created - Registry
    tag: scheduled-task-created-registry
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1053.005\"], \"author\": \"Center for Threat Informed Defense (CTID) Summiting the Pyramid Team\"}"
    query: icontains(Reg.TargetObject, "\\Microsoft\\Windows NT\\CurrentVersion\\Schedule\\TaskCache\\Tasks\\") or icontains(Reg.TargetObject, "\\Microsoft\\Windows NT\\CurrentVersion\\Schedule\\TaskCache\\Tree\\")
    hive:
      - HKLM
      - HKU
    event-types:
      - Reg.Key.Create
      - Reg.Value.Write
      - Reg.Key.Delete
      - Reg.Value.Delete
      - Reg.Key.Rename
      - Reg.Key.Load
      - Reg.Key.Unload
      - Reg.Key.Save
      - Reg.Key.Restore
      - Reg.Key.Replace
    generic-properties:
      - Reg.TargetObject
  - platform: windows
    rule-id: cdf05894-89e7-4ead-b2b0-0a5f97a90f2f
    rule-name: Potential Encoded PowerShell Patterns In CommandLine
    tag: proc-start-potential-encoded-powershell-patterns-in-commandline
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1027\", \"T1059.001\"], \"author\": \"Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton\"}"
    query: (iendswith(Process.Path, "\\powershell.exe") or iendswith(Process.Path, "\\pwsh.exe") or Process.Name in ["PowerShell.EXE", "pwsh.dll"]) and ((icontains(Process.CommandLine, "ToInt") or icontains(Process.CommandLine, "ToDecimal") or icontains(Process.CommandLine, "ToByte") or icontains(Process.CommandLine, "ToUint") or icontains(Process.CommandLine, "ToSingle") or icontains(Process.CommandLine, "ToSByte")) and (icontains(Process.CommandLine, "ToChar") or icontains(Process.CommandLine, "ToString") or icontains(Process.CommandLine, "String")) or icontains(Process.CommandLine, "char") and icontains(Process.CommandLine, "join") or icontains(Process.CommandLine, "split") and icontains(Process.CommandLine, "join"))
    event-type: Process.Start
  - platform: windows
    rule-id: 0ef56343-059e-4cb6-adc1-4c3c967c5e46
    rule-name: Suspicious Execution of Systeminfo
    tag: proc-start-suspicious-execution-of-systeminfo
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1082\"], \"author\": \"frack113\"}"
    query: iendswith(Process.Path, "\\systeminfo.exe") or Process.Name == "sysinfo.exe"
    event-type: Process.Start
  - platform: windows
    rule-id: 90b63c33-2b97-4631-a011-ceb0f47b77c3
    rule-name: Potential Suspicious Execution From GUID Like Folder Names
    tag: proc-start-potential-suspicious-execution-from-guid-like-folder-names
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1027\"], \"author\": \"Nasreddine Bencherchali (Nextron Systems)\"}"
    query: (icontains(Process.CommandLine, "\\AppData\\Roaming\\") or icontains(Process.CommandLine, "\\AppData\\Local\\Temp\\")) and icontains(Process.CommandLine, "\\{") and icontains(Process.CommandLine, "}\\") and not (icontains(Process.Path, "\\{") and icontains(Process.Path, "}\\") or isnull(Process.Path) or Process.Path == "C:\\Windows\\System32\\drvinst.exe" or Process.Path in ["C:\\Windows\\System32\\msiexec.exe", "C:\\Windows\\SysWOW64\\msiexec.exe"])
    event-type: Process.Start
  - platform: windows
    rule-id: 25ffa65d-76d8-4da5-a832-3f2b0136e133
    rule-name: PUA - Sysinternal Tool Execution - Registry
    tag: pua-sysinternal-tool-execution-registry
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1588.002\"], \"author\": \"Markus Neis\"}"
    query: iendswith(Reg.TargetObject, "\\EulaAccepted")
    hive:
      - HKLM
      - HKU
    event-types:
      - Reg.Value.Write
      - Reg.Key.Rename
      - Reg.Key.Restore
      - Reg.Key.Replace
    generic-properties:
      - Reg.TargetObject
  - platform: windows
    rule-id: 3d3aa6cd-6272-44d6-8afc-7e88dfef7061
    rule-name: Change Default File Association Via Assoc
    tag: proc-start-change-default-file-association-via-assoc
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1546.001\"], \"author\": \"Timur Zinniatullin, oscd.community\"}"
    query: (iendswith(Process.Path, "\\cmd.exe") or Process.Name == "Cmd.Exe") and icontains(Process.CommandLine, "assoc")
    event-type: Process.Start
  - platform: windows
    rule-id: a29c1813-ab1f-4dde-b489-330b952e91ae
    rule-name: Suspicious Network Command
    tag: proc-start-suspicious-network-command
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1016\"], \"author\": \"frack113, Christopher Peacock '@securepeacock', SCYTHE '@scythe_io'\"}"
    query: Process.CommandLine regex "ipconfig\\s+/all" or Process.CommandLine regex "netsh\\s+interface show interface" or Process.CommandLine regex "arp\\s+-a" or Process.CommandLine regex "nbtstat\\s+-n" or Process.CommandLine regex "net\\s+config" or Process.CommandLine regex "route\\s+print"
    event-type: Process.Start
  - platform: windows
    rule-id: 62510e69-616b-4078-b371-847da438cc03
    rule-name: Share And Session Enumeration Using Net.EXE
    tag: proc-start-share-and-session-enumeration-using-net.exe
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1018\"], \"author\": \"Endgame, JHasenbusch (ported for oscd.community)\"}"
    query: (iendswith(Process.Path, "\\net.exe") or iendswith(Process.Path, "\\net1.exe") or Process.Name in ["net.exe", "net1.exe"]) and icontains(Process.CommandLine, "view") and not icontains(Process.CommandLine, "\\\\")
    event-type: Process.Start
  - platform: windows
    rule-id: 259e5a6a-b8d2-4c38-86e2-26c5e651361d
    rule-name: PsExec Service File Creation
    tag: psexec-service-file-creation
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1569.002\"], \"author\": \"Thomas Patzke\"}"
    query: iendswith(File.Path, "\\PSEXESVC.exe")
    event-type: File.Create
    generic-properties:
      - File.Path
  - platform: windows
    rule-id: 7f2376f9-42ee-4dfc-9360-fecff9a88fc8
    rule-name: BitLockerTogo.EXE Execution
    tag: proc-start-bitlockertogo.exe-execution
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1218\"], \"author\": \"Josh Nickels, mttaggart\"}"
    query: iendswith(Process.Path, "\\BitLockerToGo.exe")
    event-type: Process.Start
  - platform: windows
    rule-id: 0e29e3a7-1ad8-40aa-b691-9f82ecd33d66
    rule-name: Office Macro File Download
    tag: office-macro-file-download
    risk-score: 25
    annotation: "{\"mitre_attack\": [\"T1566.001\"], \"author\": \"Nasreddine Bencherchali (Nextron Systems)\"}"
