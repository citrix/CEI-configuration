#
# This is the default remote configuration file for uberAgent
#
# On macOS, this file must be located in /Library/Application Support/uberAgent and must be named exactly
# uberAgent-remote-config-macOS.conf.
# A YAML descriptor is supported as well and takes precedence over this one:
# uberAgent-remote-config-macOS.yaml, or uberAgent-remote-config-macOS.yml.

#
# Documentation: https://docs.citrix.com/en-us/uberagent/current-release/installation/central-config-file-management/
#

############################################
#
# Central configuration management
#
# Configurable settings in this section:
#
#   Setting name: ConfigFilePath
#   Description: The path to the configuration archive on a remote source. This should be a path to a mounted SMB share.
#   Valid values: Any valid path to a subfolder under /Volumes, e.g. "/Volumes/share/configuration" (quotes may be used, but are not necessary)
#   Default: empty
#   Required: yes
#
############################################

[RemoteConfiguration]
